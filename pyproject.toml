[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antigravity"
version = "0.1.0"
description = "Autonomous RL-driven quantitative trading system with self-healing agentic overseer"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # --- Core Async I/O ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "winloop>=0.1.6; sys_platform == 'win32'",
    "uvloop>=0.21; sys_platform != 'win32'",

    # --- Persistence ---
    "clickhouse-connect>=0.8",

    # --- Data Processing (Zero-Copy, Arrow-backed) ---
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.14",

    # --- Machine Learning ---
    "scikit-learn>=1.5",

    # --- Reinforcement Learning ---
    "gymnasium>=1.3.0",
    "stable-baselines3>=2.4",
    "torch>=2.4",

    # --- Configuration ---
    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    # --- Observability ---
    "structlog>=24.4",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",

    # --- OpenTelemetry (LangSmith export) ---
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",

    # --- Execution Clients ---
    "cryptography>=44.0",
    "httpx>=0.27",

    # --- ONNX Export ---
    "onnx>=1.17",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[project.scripts]
antigrav = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/antigravity", "src/cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
