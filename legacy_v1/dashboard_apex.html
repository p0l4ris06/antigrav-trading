<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH TERMINAL APEX | BRIDGE</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --acid: #ccff00;
            --bone: #e0e0e0;
            --steel: #2a2a2a;
        }
        body {
            background: var(--bg);
            color: var(--bone);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            border: 1px solid var(--steel);
            padding: 40px;
            max-width: 600px;
        }
        h1 {
            font-size: 3rem;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }
        span { color: var(--acid); }
        p { color: #666; font-family: 'JetBrains Mono'; font-size: 0.8rem; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            background: var(--acid);
            color: var(--bg);
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ZENITH <span>APEX</span></h1>
        <p>MISSION_CONTROL :: SOVEREIGN_INTERFACE_V2_READY</p>
        <div style="margin-bottom: 20px;">
            <a href="http://localhost:8000" class="btn">INITIALIZE CORE GATEWAY</a>
        </div>
        <p style="font-size: 0.6rem; opacity: 0.5;">NOTE: Gateway server must be running on port 8000.<br>Run: python -m antigravity.gateway.server</p>
    </div>
    <script>
        // Auto-check if gateway is up
        fetch('http://localhost:8000/api/health')
            .then(r => {
                if(r.ok) window.location.href = 'http://localhost:8000';
            })
            .catch(() => console.log('Gateway offline...'));
    </script>
</body>
</html>
