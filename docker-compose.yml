services:
  # --- ClickHouse Persistence Layer ---
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: antigravity-clickhouse
    ports:
      - "8123:8123"   # HTTP interface (clickhouse-connect)
      - "9000:9000"   # Native TCP protocol
    environment:
      CLICKHOUSE_USER: ${AG_CH_USER:-admin}
      CLICKHOUSE_PASSWORD: ${AG_CH_PASSWORD:-admin123}
      CLICKHOUSE_DB: ${AG_CH_DATABASE:-antigravity}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # Mount schema for auto-initialization
      - ./antigravity/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Antigravity Gateway + Dashboard ---
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-gateway
    ports:
      - "${AG_GATEWAY_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      AG_CH_HOST: clickhouse
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
