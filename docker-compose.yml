version: "3.8"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: antigravity-clickhouse
    ports:
      - "8123:8123"   # HTTP interface (clickhouse-connect)
      - "9000:9000"   # Native TCP protocol
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DB: antigravity
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # Mount schema for auto-initialization
      - ./antigravity/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
