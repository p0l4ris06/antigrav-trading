[package]
name = "antigravity-inference"
version = "0.1.0"
edition = "2021"
description = "Bare-metal inference engine for Antigravity RL policies (ONNX via tract)"

[dependencies]
# Zero-overhead async runtime
tokio = { version = "1", features = ["full"] }

# ONNX inference (pure Rust, no C++ dependency)
tract-onnx = "0.21"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1"
